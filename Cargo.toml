[package]
name = "aureum-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4"
actix-cors = "0.7"
actix-rt = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "bigdecimal"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Environment variables
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Password hashing
argon2 = "0.5"

# JWT tokens
jsonwebtoken = "9"

# Technical analysis (for indicators)
ta = "0.5"

# Lazy static for global state
lazy_static = "1.4"

# Environment config parsing
envy = "0.4"

# HTTP client for OANDA API and Solana RPC
reqwest = { version = "0.11", features = ["json", "blocking"] }

# URL encoding
urlencoding = "2.1"

# Regex for signal parsing
regex = "1"

# Telegram MTProto client
grammers-client = "0.6"
grammers-session = "0.5"
grammers-tl-types = "0.6"
rust_decimal = { version = "1.40.0", features = ["serde"] }

# Solana - using bs58 for address validation, reqwest for RPC calls
bs58 = "0.5"
rand = "0.10.0"
bigdecimal = "0.4.10"
